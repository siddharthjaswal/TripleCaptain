name: Deploy

# Push-to-deploy: on every push to main (or a manual run), SSH into the
# server, pull the latest main, install, build, and restart the pm2 process.
#
# Requires repo secrets: SSH_HOST, SSH_USER, SSH_KEY (private deploy key).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & restart on server
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 15m
          script: |
            set -euo pipefail
            export PATH="/usr/local/bin:/usr/bin:/bin:$PATH"
            cd /bionics/projects/triplecaptain
            echo "→ Fetching latest main"
            git fetch --all --quiet
            git reset --hard origin/main
            echo "→ Installing dependencies"
            corepack pnpm install --frozen-lockfile
            echo "→ Applying schema changes"
            corepack pnpm prisma db push --skip-generate --accept-data-loss
            echo "→ Building"
            corepack pnpm build
            echo "→ Restarting app"
            pm2 restart triplecaptain-web --update-env
            pm2 save
            echo "→ Refreshing zero-token projections (non-fatal)"
            corepack pnpm precompute || echo "⚠ precompute failed — app is up, data will refresh on the nightly run"
            echo "✓ Deployed $(git rev-parse --short HEAD)"
