name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Normalize image name
        id: image
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm typecheck

      - name: ESLint check
        run: pnpm lint

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.image.outputs.IMAGE_NAME }}
          tags: |
            type=sha,prefix={{branch}}-
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.IMAGE_NAME }}:latest
            ghcr.io/${{ steps.image.outputs.IMAGE_NAME }}:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Gulmarg server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 1970
          script: |
            set -e
            echo "--- TACTICAL DEPLOYMENT STARTING ---"
            
            # 1. Login to GitHub Container Registry with sudo
            echo "${{ secrets.GHCR_TOKEN }}" | sudo docker login ghcr.io -u siddharthjaswal --password-stdin

            # 2. Force pull the SHA image with sudo
            sudo docker pull ghcr.io/${{ steps.image.outputs.IMAGE_NAME }}:${{ github.sha }}

            # 3. Tag it with sudo
            sudo docker tag ghcr.io/${{ steps.image.outputs.IMAGE_NAME }}:${{ github.sha }} ghcr.io/${{ steps.image.outputs.IMAGE_NAME }}:latest

            # 4. Reset the container with sudo
            sudo docker stop triple-captain || true
            sudo docker rm triple-captain || true

            # 5. Start fresh with sudo and explicit env path
            sudo docker run -d \
              --name triple-captain \
              --restart unless-stopped \
              -p 3000:3000 \
              --env-file /home/deploy/triple-captain/.env.production \
              ghcr.io/${{ steps.image.outputs.IMAGE_NAME }}:${{ github.sha }}

            # 6. Strategic pause for startup
            echo "Waiting for kickoff (15s)..."
            sleep 15

            # 7. Verification check (Bypass Nginx)
            echo "Running health check..."
            curl -f http://localhost:3000/api/health
            
            echo "--- TACTICAL DEPLOYMENT SUCCESSFUL ---"

      - name: Notify success
        if: success()
        run: |
          echo "🚀 Deployment successful!"
          echo "Visit: https://triplecaptain.in"

      - name: Notify failure
        if: failure()
        run: |
          echo "❌ Deployment failed!"
          exit 1
